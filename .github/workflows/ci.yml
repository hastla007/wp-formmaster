name: CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Lint, coding standards, static analysis, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.5', tools: composer:v2 }
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer phpcs
      - name: PHPStan
        run: |
          composer install --no-interaction --no-progress --working-dir=tools/phpstan
          tools/phpstan/vendor/bin/phpstan analyse --memory-limit=1G -c phpstan.neon.dist --no-progress
      - name: Composer audit (dependencies, P1-15)
        run: composer audit --no-interaction
      - name: Secret scan (P1-15)
        run: bin/check-secrets.sh
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  assets:
    name: Asset build is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run build:check

  integration:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }} / ${{ matrix.db }}${{ matrix.experimental && ' (experimental)' || '' }}
    runs-on: ubuntu-latest
    # Minimum versions (decision 21): PHP 8.5, WordPress 7.0, MySQL 9.7 LTS, MariaDB 12.3 LTS.
    # PHP 8.6 (GA 2026-11-19) runs as setup-php's nightly build: shown, but does not fail the run.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.5' ]
        wp: [ '7.0.8', 'latest' ]
        db: [ 'mariadb:12.3', 'mysql:9.7' ]
        experimental: [ false ]
        include:
          - { php: '8.6', wp: 'latest', db: 'mariadb:12.3', experimental: true }
    services:
      database:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_tests
          MYSQL_USER: wp
          MYSQL_PASSWORD: wp
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wp_tests
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot || healthcheck.sh --connect"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      WP_TESTS_DB_HOST: 127.0.0.1:3306
      WP_TESTS_DB_NAME: wp_tests
      WP_TESTS_DB_USER: wp
      WP_TESTS_DB_PASSWORD: wp
      WP_VERSION: ${{ matrix.wp }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', extensions: mysqli, tools: composer:v2 }
      - run: composer install --no-interaction --no-progress
      - run: bin/install-wp-tests.sh "$WP_VERSION"
      - run: vendor/bin/phpunit
      - name: Two-plugin contract tests (core + reference connector loaded as plugin)
        run: FC_LOAD_REFERENCE_CONNECTOR=1 vendor/bin/phpunit --group two-plugin

  e2e:
    name: Browser E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, firefox, webkit ]
    services:
      database:
        image: mariadb:12.3
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: wp_e2e, MARIADB_USER: wp, MARIADB_PASSWORD: wp }
        ports: [ '3306:3306' ]
        options: --health-cmd="healthcheck.sh --connect" --health-interval=10s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.5', extensions: mysqli }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci && npm install --no-save playwright@1 && npx playwright install --with-deps ${{ matrix.browser }}
      - run: sudo apt-get install -y mariadb-client
      - run: E2E_DB_HOST=127.0.0.1:3306 bin/e2e-site.sh start
      - run: E2E_BROWSERS=${{ matrix.browser }} npm run e2e

  release:
    name: Release ZIP check
    runs-on: ubuntu-latest
    needs: [ static, assets ]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.5' }
      - run: bin/build-release.sh
      - run: bin/check-release.sh
      - uses: actions/upload-artifact@v4
        with: { name: form-captain-zip, path: dist/ }
