-weight="400">Abmelden</text><text x="420" y="214" font-family="Arial, sans-serif" font-size="14" fill="#3c434a" font-weight="400">Bestellung #1042 wurde am 14. November 2026 aufgegeben und ist derzeit in Bearbeitung.</text><text x="420" y="262" font-family="Arial, sans-serif" font-size="20" fill="#1d2327" font-weight="700">Angaben zu Ihrer Bestellung</text><text x="420" y="286" font-family="Arial, sans-serif" font-size="13" fill="#50575e" font-weight="400">Für einige Artikel benötigen wir noch Informationen. Bitte füllen Sie die Fragebögen aus.</text><rect x="420" y="308" width="854" height="160" rx="4" fill="#ffffff" stroke="#dcdcde" stroke-width="1"/><rect x="440" y="328" width="56" height="56" rx="4" fill="#f0f0f1" stroke="none"/><text x="514" y="348" font-family="Arial, sans-serif" font-size="15" fill="#1d2327" font-weight="700">Personalisierte Holztafel</text><text x="514" y="368" font-family="Arial, sans-serif" font-size="12" fill="#646970" font-weight="400">Eiche · 40 cm · Menge 1</text><rect x="514" y="382" width="78" height="24" rx="12" fill="#FFF5E5" stroke="none"/><text x="525" y="398" font-family="Inter,Arial,sans-serif" font-size="10" fill="#A66A11" font-weight="650">Ausstehend</text><rect x="600" y="382" width="178" height="24" rx="4" fill="#FFFFFF" stroke="#B54747" stroke-width="1"/><text x="611" y="398" font-family="Inter,Arial,sans-serif" font-size="10" fill="#B54747" font-weight="650">vor Bearbeitung erforderlich</text><text x="514" y="430" font-family="Arial, sans-serif" font-size="12" fill="#3c434a" font-weight="400">Wir beginnen mit der Fertigung, sobald der Gravurtext vorliegt.</text><text x="514" y="448" font-family="Arial, sans-serif" font-size="12" fill="#646970" font-weight="400">Dauer ca. 2 Minuten · ein Fragebogen für diese Position</text><rect x="1050" y="338" width="200" height="42" rx="3" fill="#2271b1" stroke="none"/><text x="1150.0" y="364" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">Fragebogen ausfüllen</text><rect x="420" y="484" width="854" height="160" rx="4" fill="#ffffff" stroke="#dcdcde" stroke-width="1"/><rect x="440" y="504" width="56" height="56" rx="4" fill="#f0f0f1" stroke="none"/><text x="514" y="524" font-family="Arial, sans-serif" font-size="15" fill="#1d2327" font-weight="700">Personalisierte Holztafel</text><text x="514" y="544" font-family="Arial, sans-serif" font-size="12" fill="#646970" font-weight="400">Walnuss · 60 cm · Menge 2</text><rect x="514" y="558" width="122" height="24" rx="12" fill="#EAF1FF" stroke="none"/><text x="525" y="574" font-family="Inter,Arial,sans-serif" font-size="10" fill="#2271b1" font-weight="650">Erneut angefordert</text><rect x="644" y="558" width="178" height="24" rx="4" fill="#FFFFFF" stroke="#B54747" stroke-width="1"/><text x="655" y="574" font-family="Inter,Arial,sans-serif" font-size="10" fill="#B54747" font-weight="650">vor Bearbeitung erforderlich</text><text x="514" y="606" font-family="Arial, sans-serif" font-size="12" fill="#3c434a" font-weight="400">Der Shop bittet um eine Korrektur Ihrer Angaben. Ihre erste Antwort bleibt gespeichert.</text><text x="514" y="624" font-family="Arial, sans-serif" font-size="12" fill="#646970" font-weight="400">Ein Fragebogen für diese Position (gilt für beide Stück)</text><rect x="1050" y="514" width="200" height="42" rx="3" fill="#2271b1" stroke="none"/><text x="1150.0" y="540" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">Angaben korrigieren</text><rect x="420" y="660" width="854" height="140" rx="4" fill="#ffffff" stroke="#dcdcde" stroke-width="1"/><rect x="440" y="680" width="56" height="56" rx="4" fill="#f0f0f1" stroke="none"/><text x="514" y="700" font-family="Arial, sans-serif" font-size="15" fill="#1d2327" font-weight="700">Grußkarte</text><text x="514" y="720" font-family="Arial, sans-serif" font-size="12" fill="#646970" font-weight="400">Herbst · Menge 1</text><rect x="514" y="734" width="94" height="24" rx="12" fill="#EAF7EF" stroke="none"/><text x="525" y="750" font-family="Inter,Arial,sans-serif" font-size="10" fill="#237348" font-weight="650">Abgeschlossen</text><rect x="616" y="734" width="66" height="24" rx="4" fill="#FFFFFF" stroke="#667386" stroke-width="1"/><text x="627" y="750" font-family="Inter,Arial,sans-serif" font-size="10" fill="#667386" font-weight="650">optional</text><text x="514" y="782" font-family="Arial, sans-serif" font-size="12" fill="#3c434a" font-weight="400">Eingereicht am 15. November 2026. Änderungswunsch? Bitte kontaktieren Sie uns.</text><rect x="420" y="812" width="854" height="54" rx="4" fill="#f0f6fc" stroke="#c5d9ed" stroke-width="1"/><path d="M442 838 v-7 a6 6 0 0 1 12 0 v7" fill="none" stroke="#2271b1" stroke-width="1.8"/><rect x="438" y="836" width="20" height="15" rx="2" fill="#2271b1" stroke="none"/><text x="472" y="834" font-family="Arial, sans-serif" font-size="12" fill="#1d2327" font-weight="400">Nur für Sie sichtbar: Zugriff über Ihr Kundenkonto geprüft. Gäste erhalten einen zeitlich begrenzten, widerrufbaren Link.</text><text x="472" y="854" font-family="Arial, sans-serif" font-size="11" fill="#50575e" font-weight="400">Antworten stehen nie in Links oder E-Mails.</text><rect x="166" y="500" width="220" height="220" rx="4" fill="#ffffff" stroke="#dcdcde" stroke-width="1" stroke-dasharray="4 3"/><text x="182" y="526" font-family="Arial, sans-serif" font-size="12" fill="#1d2327" font-weight="700">Zustand: Gastlink abgelaufen</text><text x="182" y="552" font-family="Arial, sans-serif" font-size="12" fill="#3c434a" font-weight="400">Dieser Link ist nicht mehr</text><text x="182" y="570" font-family="Arial, sans-serif" font-size="12" fill="#3c434a" font-weight="400">gültig.</text><text x="182" y="600" font-family="Arial, sans-serif" font-size="12" fill="#3c434a" font-weight="400">Neuen Link an die E-Mail-</text><text x="182" y="618" font-family="Arial, sans-serif" font-size="12" fill="#3c434a" font-weight=