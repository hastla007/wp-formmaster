ont-size="12" fill="#3c434a" font-weight="400">• Holztafel: erforderlich</text><text x="994" y="482" font-family="Arial, sans-serif" font-size="12" fill="#3c434a" font-weight="400">• Grußkarte: optional</text><text x="994" y="510" font-family="Arial, sans-serif" font-size="11" fill="#50575e" font-weight="400">Antworten werden erst nach bestätigter</text><text x="994" y="526" font-family="Arial, sans-serif" font-size="11" fill="#50575e" font-weight="400">Zahlung abgefragt – nicht an der Kasse.</text><text x="994" y="548" font-family="Arial, sans-serif" font-size="11" fill="#50575e" font-weight="400">Eine Angabe je Position, nicht je Stück.</text><rect x="978" y="584" width="272" height="48" rx="3" fill="#2271b1" stroke="none"/><text x="1114" y="614" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">Weiter zur Kasse</text><text x="954" y="700" font-family="Arial, sans-serif" font-size="11" fill="#646970" font-weight="400">Gleiche Hinweise erscheinen auf der Produktseite und</text><text x="954" y="716" font-family="Arial, sans-serif" font-size="11" fill="#646970" font-weight="400">in der Bestellübersicht des Checkouts (klassisch und Block).</text><text x="954" y="732" font-family="Arial, sans-serif" font-size="11" fill="#646970" font-weight="400">Es werden keine Checkout-Felder hinzugefügt.</text><text x="166" y="860" font-family="Arial, sans-serif" font-size="11" fill="#7a7f85" font-weight="400">Konzeptansicht – kein Screenshot. Käuferhinweis im Warenkorb vor dem Kauf (WooCommerce-Theme-Darstellung). Beispieldaten.</text></svg>