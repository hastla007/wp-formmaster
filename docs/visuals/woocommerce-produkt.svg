er,Arial,sans-serif" font-size="12" fill="#455266" font-weight="400">Eigenschaften</text><line x1="275" y1="425" x2="475" y2="425" stroke="#E5EAF1" stroke-width="1"/><text x="294" y="450" font-family="Inter,Arial,sans-serif" font-size="12" fill="#455266" font-weight="400">Variationen</text><line x1="275" y1="465" x2="475" y2="465" stroke="#E5EAF1" stroke-width="1"/><text x="294" y="490" font-family="Inter,Arial,sans-serif" font-size="12" fill="#455266" font-weight="400">Erweitert</text><line x1="275" y1="505" x2="475" y2="505" stroke="#E5EAF1" stroke-width="1"/><rect x="275" y="505" width="201" height="40" rx="0" fill="#FFFFFF" stroke="none"/><rect x="275" y="505" width="3" height="40" rx="0" fill="#2271b1" stroke="none"/><text x="294" y="530" font-family="Inter,Arial,sans-serif" font-size="12" fill="#2271b1" font-weight="700">Käuferfragebogen</text><line x1="275" y1="545" x2="475" y2="545" stroke="#E5EAF1" stroke-width="1"/><rect x="294" y="561" width="38" height="24" rx="12" fill="#EAF1FF" stroke="none"/><text x="305" y="577" font-family="Inter,Arial,sans-serif" font-size="10" fill="#2271b1" font-weight="650">Pro</text><text x="500" y="258" font-family="Inter,Arial,sans-serif" font-size="15" fill="#18283F" font-weight="700">Käuferfragebogen nach dem Kauf</text><rect x="762" y="241" width="111" height="24" rx="12" fill="#EAF1FF" stroke="none"/><text x="773" y="257" font-family="Inter,Arial,sans-serif" font-size="10" fill="#2271b1" font-weight="650">Form Captain Pro</text><text x="500" y="282" font-family="Inter,Arial,sans-serif" font-size="11" fill="#748195" font-weight="400">Fragt nach bestätigter Zahlung Angaben je Bestellposition ab. Kein Checkout-Feld, keine Zahlung.</text><rect x="500" y="304" width="18" height="18" rx="4" fill="#2271b1" stroke="none"/><path d="M504 313 L508 317 L514 309" fill="none" stroke="#FFFFFF" stroke-width="2"/><text x="528" y="318" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526174" font-weight="400">Käuferfragebogen für dieses Produkt aktivieren</text><text x="528" y="338" font-family="Inter,Arial,sans-serif" font-size="11" fill="#748195" font-weight="400">Standard für neue Produkte: deaktiviert</text><text x="500" y="376" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526174" font-weight="600">Formular</text><rect x="500" y="388" width="560" height="42" rx="7" fill="#FFFFFF" stroke="#DCE3EB" stroke-width="1"/><text x="516" y="414.0" font-family="Inter,Arial,sans-serif" font-size="12" fill="#344054" font-weight="400">Gravurangaben  ·  veröffentlicht  ·  Version 3</text><text x="1032" y="414.0" font-family="Inter,Arial,sans-serif" font-size="12" fill="#748195" font-weight="400">⌄</text><text x="500" y="448" font-family="Inter,Arial,sans-serif" font-size="11" fill="#748195" font-weight="400">Nur veröffentlichte Form-Captain-Formulare. Die Version wird je Bestellposition beim Kauf eingefroren.</text><text x="500" y="486" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526174" font-weight="600">Verbindlichkeit</text><circle cx="509" cy="509" r="8" fill="#FFFFFF" stroke="#BBC6D3" stroke-width="1.5"/><text x="528" y="514" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526174" font-weight="400">Optional – Käufer kann den Fragebogen ausfüllen</text><circle cx="509" cy="541" r="8" fill="#FFFFFF" stroke="#2271b1" stroke-width="1.5"/><circle cx="509" cy="541" r="4" fill="#2271b1"/><text x="528" y="546" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526174" font-weight="400">Vor Bearbeitung erforderlich</text><rect x="738" y="529" width="178" height="24" rx="4" fill="#FFFFFF" stroke="#B54747" stroke-width="1"/><text x="749" y="545" font-family="Inter,Arial,sans-serif" font-size="10" fill="#B54747" font-weight="650">vor Bearbeitung erforderlich</text><text x="528" y="570" font-family="Inter,Arial,sans-serif" font-size="11" fill="#748195" font-weight="400">Erfüllungshinweis für Shopmitarbeiter – ändert weder Zahlungs- noch Bestellstatus,</text><text x="528" y="584" font-family="Inter,Arial,sans-serif" font-size="11" fill="#748195" font-weight="400">Downloads oder Versand.</text><rect x="500" y="598" width="570" height="66" rx="4" fill="#EAF1FF" stroke="none"/><rect x="500" y="598" width="4" height="66" rx="0" fill="#2271b1" stroke="none"/><circle cx="526" cy="618" r="8" fill="none" stroke="#2271b1" stroke-width="1.5"/><text x="526" y="622" font-family="Inter,Arial,sans-serif" font-size="11" fill="#2271b1" font-weight="700" text-anchor="middle">i</text><text x="544" y="622" font-family="Inter,Arial,sans-serif" font-size="12" fill="#18283F" font-weight="650">Variationen übernehmen diese Zuordnung</text><text x="544" y="642" font-family="Inter,Arial,sans-serif" font-size="11" fill="#526174" font-weight="400">Gilt für alle 3 Variationen (Eiche, Walnuss, Buche). Abweichende Zuordnung je Variation ist</text><text x="544" y="657" font-family="Inter,Arial,sans-serif" font-size="11" fill="#526174" font-weight="400">in v1 nicht vorgesehen.</text><text x="500" y="694" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526174" font-weight="600">Hinweis vor dem Kauf (Produktseite, Warenkorb, Bestellübersicht)</text><rect x="500" y="706" width="570" height="60" rx="7" fill="#FFFFFF" stroke="#DCE3EB" stroke-width="1"/><text x="516" y="730" font-family="Inter,Arial,sans-serif" font-size="12" fill="#344054" font-weight="400">Nach dem Kauf bitten wir Sie um den Gravurtext. Ohne diese Angabe können</text><text x="516" y="750" font-family="Inter,Arial,sans-serif" font-size="12" fill="#344054" font-weight="400">wir Ihre Bestellung nicht fertigen.</text><rect x="500" y="780" width="18" height="18" rx="4" fill="#2271b1" stroke="none"/><path d="M504 789 L508 793 L514 785" fill="none" stroke="#FFFFFF" stroke-width="2"/><text x="528" y="794" font-family="Inter,Arial,sans-serif" font-size="11" fill="#526174" font-weight="400">Link zur Datenschutzerklärung anzeigen</text><text x="800" y="794" font-family="Inter,Arial,sans-serif" font-size="11" fill="#748195" font-weight="400">Eine Antwort je Bestellposition, nicht je Stück.</text><rect x="1114" y="112" width="266" height="196" rx="12" fill="#FFFFFF" stroke="#E6EAF0" stroke-width="1"/><text x="1138" y="145" font-family="Inter,Arial,sans-serif" font-size="16" fill="#18283F" font-weight="700">Veröffentlichen</text><text x="1138" y="176" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526174" font-weight="400">Status: Veröffentlicht</text><text x="1138" y="200" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526174" font-weight="400">Sichtbarkeit: Öffentlich</text><rect x="1138" y="244" width="218" height="38" rx="8" fill="#2271b1" stroke="none"/><text x="1152" y="267.0" font-family="Inter,Arial,sans-serif" font-size="12" fill="#FFFFFF" font-weight="650">Aktualisieren</text><rect x="1114" y="324" width="266" height="230" rx="12" fill="#FFFFFF" stroke="#E6EAF0" stroke-width="1"/><text x="1138" y="357" font-family="Inter,Arial,sans-serif" font-size="16" fill="#18283F" font-weight="700">Fragebogen-Status</text><rect x="1138" y="372" width="106" height="24" rx="12" fill="#EAF7EF" stroke="none"/><text x="1149" y="388" font-family="Inter,Arial,sans-serif" font-size="10" fill="#237348" font-weight="650">Zuordnung aktiv</text><text x="1138" y="420" font-family="Inter,Arial,sans-serif" font-size="11" fill="#748195" font-weight="400">Pro-Recht</text><text x="1138" y="438" font-family="Inter,Arial,sans-serif" font-size="11" fill="#344054" font-weight="600">form.woocommerce_questionnaires</text><text x="1138" y="468" font-family="Inter,Arial,sans-serif" font-size="11" fill="#748195" font-weight="400">Offene Fragebögen zu diesem Produkt</text><text x="1138" y="490" font-family="Inter,Arial,sans-serif" font-size="12" fill="#344054" font-weight="600">4 ausstehend · 1 erneut angefordert</text><text x="1138" y="526" font-family="Inter,Arial,sans-serif" font-size="10" fill="#748195" font-weight="400">Offene bleiben bei Lizenzende bedienbar.</text><rect x="1114" y="570" width="266" height="150" rx="12" fill="#FFFFFF" stroke="#E6EAF0" stroke-width="1"/><text x="1138" y="603" font-family="Inter,Arial,sans-serif" font-size="16" fill="#18283F" font-weight="700">Produktbild</text><rect x="1138" y="616" width="218" height="84" rx="6" fill="#F0F2F5" stroke="none"/><text x="1247" y="664" font-family="Inter,Arial,sans-serif" font-size="12" fill="#748195" font-weight="400" text-anchor="middle">Bild</text><text x="274" y="860" font-family="Inter,Arial,sans-serif" font-size="11" fill="#8490A0" font-weight="400">Konzeptansicht – kein Screenshot. WooCommerce-Produkteditor (klassisch) mit Tab „Käuferfragebogen“ aus Form Captain Pro. Beispieldaten.</text></svg>